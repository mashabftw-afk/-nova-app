
name: Build NOVA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Extract NOVA project
        run: |
          unzip -o NOVA_1_0_Android_Cloud_Build.zip -d .

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        working-directory: nova_work/client
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: nova_work/client
        run: flutter pub get

      - name: Build APK
        working-directory: nova_work/client
        run: flutter build apk --release

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Android-APK
          path: nova_work/client/build/app/outputs/flutter-apk/app-release.apk
